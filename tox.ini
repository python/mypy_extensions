[tox]
minversion = 4.4.4
skip_missing_interpreters = true
envlist = py310, py311, py312, py313, py314, py315

[testenv]
description = run the test driver with {basepython}
commands = python -We -m unittest discover tests

[testenv:lint]
description = check the code style
basepython = python3
deps = flake8
commands = flake8 -j0 {posargs}

[flake8]
max-line-length = 99
ignore =
  # multiple statements on one line (colon) (we use this for classes with empty body)
  E701

[testenv:typing]
description = check built artifacts and installed type declarations
deps =
    build
    mypy==2.4.1
    pyright==1.1.414
commands =
    python -m build
    python tests/check_typing.py

[testenv:typing-old]
description = verify compatibility with mypy's older bundled declarations
deps =
    build
    mypy==1.10.0
    pyright==1.1.414
commands = {[testenv:typing]commands}
